<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580" role="img" aria-label="Architecture: Game, a QGraphicsView, owns one QGraphicsScene holding Player, Bullet, Platform, Item, Monster, Score and Button. Player lands on platforms, picks up items, stomps or is hurt by monsters and fires bullets; bullets kill monsters." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EFE5D2" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1060" height="580" rx="16"/></clipPath>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5B5348"/>
    </marker>
    <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#26231F"/>
    </marker>
  </defs>

  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1060" height="580" fill="#FBF6EA"/>
    <rect width="1060" height="580" fill="url(#grid)"/>

    <text x="40" y="46" font-size="22" font-weight="700" fill="#26231F">Architecture</text>
    <text x="40" y="70" font-size="14.5" fill="#5B5348">Game owns one QGraphicsScene, and every object on screen is an item in it. Sprite classes inherit QObject + QGraphicsPixmapItem.</text>

    <!-- ================= Game ================= -->
    <rect x="40" y="112" width="222" height="330" rx="12" fill="#FFFFFF" stroke="#26231F" stroke-width="1.6"/>
    <path d="M40 124 a12 12 0 0 1 12 -12 h198 a12 12 0 0 1 12 12 v44 h-222 z" fill="#26231F"/>
    <text x="58" y="141" font-size="18" font-weight="700" fill="#FFFFFF">Game</text>
    <text x="58" y="159" font-size="11.5" fill="#CFC6B6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QGraphicsView</text>
    <g font-size="12.5">
      <text x="58" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">startplay()</text>
      <text x="58" y="216" fill="#7C6F5E">builds a new run</text>
      <text x="58" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">movePlatforms(dy)</text>
      <text x="58" y="266" fill="#7C6F5E">scrolls the world</text>
      <text x="58" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">createPlatform()</text>
      <text x="58" y="316" fill="#7C6F5E">level generator</text>
      <text x="58" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">decreaseHp()</text>
      <text x="58" y="366" fill="#7C6F5E">hearts on the HUD</text>
      <text x="58" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">requestGameOver()</text>
      <text x="58" y="416" fill="#7C6F5E">deferred teardown</text>
    </g>

    <!-- owns -->
    <line x1="262" y1="277" x2="300" y2="277" stroke="#26231F" stroke-width="1.8" marker-end="url(#dark)"/>
    <text x="281" y="266" font-size="12" font-weight="600" fill="#26231F" text-anchor="middle">owns</text>

    <!-- ================= Scene ================= -->
    <rect x="302" y="96" width="728" height="456" rx="16" fill="#FFFDF7" fill-opacity="0.7" stroke="#B9A584" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="322" y="122" font-size="12" font-weight="700" letter-spacing="1.8" fill="#8A7A63">QGRAPHICSSCENE</text>

    <!-- Score / Button -->
    <g>
      <rect x="322" y="138" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#D9CBB2" stroke-width="1.4"/>
      <text x="336" y="160" font-size="14" font-weight="700" fill="#26231F">Score</text>
      <text x="336" y="178" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QGraphicsTextItem</text>
      <rect x="456" y="138" width="120" height="52" rx="10" fill="#FFFFFF" stroke="#D9CBB2" stroke-width="1.4"/>
      <text x="470" y="160" font-size="14" font-weight="700" fill="#26231F">Button</text>
      <text x="470" y="178" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">clicked() signal</text>
    </g>

    <!-- Player -->
    <rect x="322" y="212" width="254" height="168" rx="12" fill="#FFFFFF" stroke="#2F2A24" stroke-width="1.6"/>
    <path d="M322 224 a12 12 0 0 1 12 -12 h230 a12 12 0 0 1 12 12 v38 h-254 z" fill="#FBEFC4"/>
    <line x1="322" y1="262" x2="576" y2="262" stroke="#E8D9A8"/>
    <circle cx="552" cy="237" r="9" fill="#F4C542" stroke="#2F2A24" stroke-width="1.6"/>
    <text x="338" y="236" font-size="17" font-weight="700" fill="#26231F">Player</text>
    <text x="338" y="253" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QObject + QGraphicsPixmapItem</text>
    <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">
      <text x="338" y="286">move()</text>
      <text x="338" y="310">handleCollisions()</text>
      <text x="338" y="334">startBoost(item)</text>
      <text x="338" y="358">Camera()</text>
    </g>
    <g font-size="12" fill="#7C6F5E" text-anchor="end">
      <text x="562" y="286">every 8 ms</text>
      <text x="562" y="334">spring … jetpack</text>
      <text x="562" y="358">half-screen lock</text>
    </g>

    <!-- Bullet -->
    <rect x="352" y="436" width="194" height="88" rx="12" fill="#FFFFFF" stroke="#2F2A24" stroke-width="1.6"/>
    <path d="M352 448 a12 12 0 0 1 12 -12 h170 a12 12 0 0 1 12 12 v34 h-194 z" fill="#EFEAE0"/>
    <line x1="352" y1="482" x2="546" y2="482" stroke="#DDD5C6"/>
    <text x="368" y="460" font-size="16" font-weight="700" fill="#26231F">Bullet</text>
    <text x="368" y="475" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QObject + QGraphicsPixmapItem</text>
    <text x="368" y="507" font-size="12.5" fill="#5B5348">aim = unit vector × speed</text>

    <!-- Platform -->
    <rect x="770" y="112" width="238" height="124" rx="12" fill="#FFFFFF" stroke="#2F2A24" stroke-width="1.6"/>
    <path d="M770 124 a12 12 0 0 1 12 -12 h214 a12 12 0 0 1 12 12 v38 h-238 z" fill="#E2F2D6"/>
    <line x1="770" y1="162" x2="1008" y2="162" stroke="#C5E0B2"/>
    <rect x="958" y="127" width="36" height="12" rx="6" fill="#6CBF3A" stroke="#2F2A24" stroke-width="1.3"/>
    <text x="786" y="136" font-size="17" font-weight="700" fill="#26231F">Platform</text>
    <text x="786" y="153" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QObject + QGraphicsPixmapItem</text>
    <g font-size="12.5" fill="#5B5348">
      <text x="786" y="186">normal · broken · moving</text>
      <text x="786" y="206">disappearing</text>
    </g>
    <text x="786" y="226" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#26231F">collide() → landed?</text>

    <!-- Item -->
    <rect x="770" y="252" width="238" height="104" rx="12" fill="#FFFFFF" stroke="#2F2A24" stroke-width="1.6"/>
    <path d="M770 264 a12 12 0 0 1 12 -12 h214 a12 12 0 0 1 12 12 v38 h-238 z" fill="#FBE5D1"/>
    <line x1="770" y1="302" x2="1008" y2="302" stroke="#F0CFAF"/>
    <rect x="976" y="265" width="18" height="18" rx="4" fill="#E08A3C" stroke="#2F2A24" stroke-width="1.3"/>
    <text x="786" y="276" font-size="17" font-weight="700" fill="#26231F">Item</text>
    <text x="786" y="293" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QObject + QGraphicsPixmapItem</text>
    <g font-size="12.5" fill="#5B5348">
      <text x="786" y="326">spring · trampoline</text>
      <text x="786" y="346">propeller hat · jetpack</text>
    </g>

    <!-- Monster -->
    <rect x="770" y="372" width="238" height="104" rx="12" fill="#FFFFFF" stroke="#2F2A24" stroke-width="1.6"/>
    <path d="M770 384 a12 12 0 0 1 12 -12 h214 a12 12 0 0 1 12 12 v38 h-238 z" fill="#E1E4F6"/>
    <line x1="770" y1="422" x2="1008" y2="422" stroke="#C7CCEC"/>
    <circle cx="985" cy="394" r="9" fill="#5E6BC4" stroke="#2F2A24" stroke-width="1.3"/>
    <text x="786" y="396" font-size="17" font-weight="700" fill="#26231F">Monster</text>
    <text x="786" y="413" font-size="10.5" fill="#8A7A63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QObject + QGraphicsPixmapItem</text>
    <g font-size="12.5" fill="#5B5348">
      <text x="786" y="446">stomp it, or lose a heart</text>
      <text x="786" y="466">one bullet kills it</text>
    </g>

    <!-- interactions -->
    <g fill="none" stroke="#5B5348" stroke-width="1.6" stroke-dasharray="5 4">
      <path d="M576 236 C 660 236, 690 186, 768 180" marker-end="url(#ink)"/>
      <path d="M576 300 C 660 300, 690 306, 768 306" marker-end="url(#ink)"/>
      <path d="M576 352 C 660 356, 690 420, 768 432" marker-end="url(#ink)"/>
      <path d="M449 380 L 449 434" marker-end="url(#ink)"/>
      <path d="M546 490 C 640 492, 700 470, 768 460" marker-end="url(#ink)"/>
    </g>
    <g font-size="12" fill="#3D3832" text-anchor="middle">
      <rect x="636" y="196" width="66" height="20" rx="10" fill="#FFFFFF" stroke="#E2D5BD"/>
      <text x="669" y="210">lands on</text>
      <rect x="636" y="292" width="66" height="20" rx="10" fill="#FFFFFF" stroke="#E2D5BD"/>
      <text x="669" y="306">picks up</text>
      <rect x="600" y="380" width="138" height="20" rx="10" fill="#FFFFFF" stroke="#E2D5BD"/>
      <text x="669" y="394">stomps / is hurt by</text>
      <rect x="458" y="398" width="44" height="20" rx="10" fill="#FFFFFF" stroke="#E2D5BD"/>
      <text x="480" y="412">fires</text>
      <rect x="640" y="480" width="44" height="20" rx="10" fill="#FFFFFF" stroke="#E2D5BD"/>
      <text x="662" y="494">kills</text>
    </g>
  </g>
</svg>
