<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Spawn table by score: normal and broken platforms, spring and monster 1 from the start; moving platform, trampoline and monster 2 from 6000; disappearing platform, propeller hat and monster 3 from 9000; jetpack and monster 4 from 12000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EFE5D2" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="560" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1000" height="560" fill="#FBF6EA"/>
    <rect width="1000" height="560" fill="url(#grid)"/>

    <text x="40" y="48" font-size="21" font-weight="700" fill="#26231F">What the level generator can spawn, by score</text>
    <text x="40" y="72" font-size="14" fill="#5B5348">From Game::createPlatform(). Once unlocked, each special platform appears at least once per interval:</text>
    <text x="40" y="92" font-size="14" fill="#5B5348">broken every 1000, moving every 3000, disappearing every 5000. A platform holds one item or one monster, never both.</text>

    <!-- guides -->
    <g stroke-width="1.5">
      <line x1="250" y1="104" x2="250" y2="500" stroke="#B9A584"/>
      <line x1="388" y1="104" x2="388" y2="500" stroke="#B9A584" stroke-dasharray="6 5"/>
      <line x1="526" y1="104" x2="526" y2="500" stroke="#B9A584" stroke-dasharray="6 5"/>
      <line x1="664" y1="104" x2="664" y2="500" stroke="#B9A584" stroke-dasharray="6 5"/>
      <line x1="802" y1="104" x2="802" y2="500" stroke="#B9A584" stroke-dasharray="6 5"/>
      <line x1="342" y1="380" x2="342" y2="500" stroke="#E2D5BD" stroke-dasharray="3 5"/>
    </g>

    <!-- section labels -->
    <g font-size="12" font-weight="700" letter-spacing="1.8" fill="#8A7A63">
      <text x="40" y="118">PLATFORMS</text>
      <text x="40" y="250">ITEMS</text>
      <text x="40" y="382">MONSTERS</text>
    </g>

    <!-- row labels -->
    <g font-size="13.5" fill="#26231F" text-anchor="end">
      <text x="232" y="137">normal</text>
      <text x="232" y="163">broken</text>
      <text x="232" y="189">moving</text>
      <text x="232" y="215">disappearing</text>

      <text x="232" y="269">spring</text>
      <text x="232" y="295">trampoline</text>
      <text x="232" y="321">propeller hat</text>
      <text x="232" y="347">jetpack</text>

      <text x="232" y="401">monster 1</text>
      <text x="232" y="427">monster 2</text>
      <text x="232" y="453">monster 3</text>
      <text x="232" y="479">monster 4</text>
    </g>

    <!-- platform bars -->
    <g stroke="#2F2A24" stroke-width="1.5">
      <path d="M250 126 H932 L944 132 L932 138 H250 Z" fill="#6CBF3A"/>
      <path d="M250 152 H932 L944 158 L932 164 H250 Z" fill="#9A6532"/>
      <path d="M526 178 H932 L944 184 L932 190 H526 Z" fill="#2E9FD8"/>
      <path d="M664 204 H932 L944 210 L932 216 H664 Z" fill="#FFFFFF" stroke-dasharray="5 4"/>
    </g>

    <!-- item bars -->
    <g fill="#E08A3C" stroke="#9C5A1E" stroke-width="1.2">
      <path d="M388 258 H932 L944 264 L932 270 H388 Z"/>
      <path d="M526 284 H932 L944 290 L932 296 H526 Z"/>
      <path d="M664 310 H932 L944 316 L932 322 H664 Z"/>
      <path d="M802 336 H932 L944 342 L932 348 H802 Z"/>
    </g>

    <!-- monster bars -->
    <g fill="#5E6BC4" stroke="#3B4590" stroke-width="1.2">
      <path d="M342 390 H932 L944 396 L932 402 H342 Z"/>
      <path d="M526 416 H932 L944 422 L932 428 H526 Z"/>
      <path d="M664 442 H932 L944 448 L932 454 H664 Z"/>
      <path d="M802 468 H932 L944 474 L932 480 H802 Z"/>
    </g>

    <!-- axis -->
    <line x1="250" y1="500" x2="944" y2="500" stroke="#2F2A24" stroke-width="1.8"/>
    <g font-size="13" fill="#3D3832" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="250" y="522">0</text>
      <text x="342" y="540" font-size="11" fill="#8A7A63">2000</text>
      <text x="388" y="522">3000</text>
      <text x="526" y="522">6000</text>
      <text x="664" y="522">9000</text>
      <text x="802" y="522">12000</text>
      <text x="940" y="522">15000+</text>
    </g>
    <text x="232" y="522" font-size="13" fill="#8A7A63" text-anchor="end">score →</text>
  </g>
</svg>
