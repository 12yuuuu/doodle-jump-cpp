<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Doodle Jump in C++17 and Qt 5: an endless vertical platformer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EADFC8" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2E9FD8"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#FBF6EA"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- text block -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="78" font-size="15" font-weight="600" letter-spacing="2.5" fill="#8A7A63">NCKU COURSE PROJECT · 2023</text>
      <text x="62" y="148" font-size="66" font-weight="800" fill="#26231F">Doodle Jump</text>
      <text x="64" y="196" font-size="32" font-weight="700" fill="#4C8A2A">in C++17 &amp; Qt 5</text>
      <text x="64" y="244" font-size="19" fill="#5B5348">Endless vertical platformer: game loop, camera, collisions</text>
      <text x="64" y="270" font-size="19" fill="#5B5348">and procedural level generation, written from scratch.</text>

      <g font-size="14" fill="#3D3832">
        <rect x="64" y="294" width="148" height="30" rx="15" fill="#FFFFFF" stroke="#D9CBB2"/>
        <text x="138" y="314" text-anchor="middle">Qt Graphics View</text>
        <rect x="222" y="294" width="134" height="30" rx="15" fill="#FFFFFF" stroke="#D9CBB2"/>
        <text x="289" y="314" text-anchor="middle">Signals &amp; Slots</text>
        <rect x="366" y="294" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#D9CBB2"/>
        <text x="428" y="314" text-anchor="middle">QMediaPlayer</text>
        <rect x="500" y="294" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#D9CBB2"/>
        <text x="559" y="314" text-anchor="middle">qmake / Make</text>
      </g>
    </g>

    <!-- jump trajectories -->
    <g fill="none" stroke="#7C6F5E" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round">
      <path d="M792 286 C 800 150, 980 140, 992 230"/>
      <path d="M992 230 C 998 120, 900 70, 882 46"/>
    </g>

    <!-- platforms (120 x 30 px in game, drawn here at ~1:1) -->
    <g stroke="#2F2A24" stroke-width="2.5">
      <!-- normal -->
      <rect x="730" y="292" width="124" height="26" rx="13" fill="#6CBF3A"/>
      <!-- broken -->
      <rect x="930" y="236" width="124" height="26" rx="13" fill="#9A6532"/>
      <!-- moving -->
      <rect x="700" y="170" width="124" height="26" rx="13" fill="#2E9FD8"/>
      <!-- disappearing -->
      <rect x="1000" y="120" width="124" height="26" rx="13" fill="#FFFFFF" stroke-dasharray="7 5"/>
      <!-- normal -->
      <rect x="820" y="52" width="124" height="26" rx="13" fill="#6CBF3A"/>
    </g>
    <!-- crack in the broken platform -->
    <path d="M990 234 L998 244 L988 252 L996 264" fill="none" stroke="#FBF6EA" stroke-width="5" stroke-linejoin="round"/>
    <!-- highlights -->
    <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
      <line x1="746" y1="300" x2="806" y2="300"/>
      <line x1="946" y1="244" x2="978" y2="244"/>
      <line x1="716" y1="178" x2="776" y2="178"/>
      <line x1="836" y1="60" x2="896" y2="60"/>
    </g>
    <!-- moving-platform arrows -->
    <g stroke="#2E9FD8" stroke-width="3" fill="none">
      <line x1="690" y1="183" x2="668" y2="183" marker-end="url(#arrow)"/>
      <line x1="834" y1="183" x2="856" y2="183" marker-end="url(#arrow)"/>
    </g>

    <!-- player marker -->
    <circle cx="891" cy="173" r="14" fill="#F4C542" stroke="#2F2A24" stroke-width="2.5"/>
  </g>
</svg>
