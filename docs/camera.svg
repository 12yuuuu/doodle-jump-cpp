<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="Camera lock: below the half-screen line the player moves; above it the player is locked and the world scrolls down, platforms leaving the bottom are deleted and new ones spawn above" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EFE5D2" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1100" height="650" rx="16"/></clipPath>
    <clipPath id="screenA"><rect x="50" y="110" width="243" height="432"/></clipPath>
    <clipPath id="screenB"><rect x="400" y="110" width="243" height="432"/></clipPath>
    <marker id="ink" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F2A24"/>
    </marker>
    <marker id="muted" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7C6F5E"/>
    </marker>
  </defs>

  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1100" height="650" fill="#FBF6EA"/>
    <rect width="1100" height="650" fill="url(#grid)"/>

    <text x="50" y="40" font-size="22" font-weight="700" fill="#26231F">Camera lock &amp; endless world</text>
    <text x="50" y="64" font-size="14.5" fill="#5B5348">540 × 960 px window, drawn at 45 %. Past the half-screen line the player stops and the world scrolls instead.</text>

    <!-- ============ Screen A ============ -->
    <rect x="50" y="110" width="243" height="432" fill="#FFFDF7" stroke="#2F2A24" stroke-width="2.5" rx="4"/>
    <g clip-path="url(#screenA)" stroke="#2F2A24" stroke-width="1.8">
      <rect x="80"  y="500" width="54" height="14" rx="7" fill="#6CBF3A"/>
      <rect x="190" y="440" width="54" height="14" rx="7" fill="#6CBF3A"/>
      <rect x="110" y="368" width="54" height="14" rx="7" fill="#9A6532"/>
      <rect x="200" y="282" width="54" height="14" rx="7" fill="#2E9FD8"/>
      <rect x="90"  y="212" width="54" height="14" rx="7" fill="#6CBF3A"/>
      <rect x="180" y="146" width="54" height="14" rx="7" fill="#FFFFFF" stroke-dasharray="4 3"/>
    </g>
    <!-- player A -->
    <circle cx="107" cy="470" r="16" fill="#F4C542" stroke="#2F2A24" stroke-width="2.2"/>
    <line x1="107" y1="446" x2="107" y2="394" stroke="#2F2A24" stroke-width="2.5" marker-end="url(#ink)"/>
    <text x="124" y="414" font-size="12.5" font-weight="600" fill="#2F2A24">player moves</text>
    <text x="124" y="430" font-size="12.5" fill="#5B5348">+5 px / tick</text>

    <!-- ============ Screen B ============ -->
    <rect x="400" y="110" width="243" height="432" fill="#FFFDF7" stroke="#2F2A24" stroke-width="2.5" rx="4"/>
    <g clip-path="url(#screenB)" stroke="#2F2A24" stroke-width="1.8">
      <rect x="430" y="470" width="54" height="14" rx="7" fill="#6CBF3A"/>
      <rect x="560" y="396" width="54" height="14" rx="7" fill="#9A6532"/>
      <rect x="440" y="250" width="54" height="14" rx="7" fill="#2E9FD8"/>
      <rect x="560" y="186" width="54" height="14" rx="7" fill="#6CBF3A"/>
      <rect x="430" y="128" width="54" height="14" rx="7" fill="#6CBF3A"/>
    </g>
    <!-- scroll arrows -->
    <g stroke="#7C6F5E" stroke-width="2" marker-end="url(#muted)">
      <line x1="457" y1="490" x2="457" y2="512"/>
      <line x1="587" y1="416" x2="587" y2="438"/>
      <line x1="467" y1="270" x2="467" y2="292"/>
      <line x1="587" y1="206" x2="587" y2="228"/>
      <line x1="457" y1="148" x2="457" y2="170"/>
    </g>
    <!-- player B (locked on the line) -->
    <circle cx="520" cy="309" r="16" fill="#F4C542" stroke="#2F2A24" stroke-width="2.2"/>
    <text x="544" y="300" font-size="12.5" font-weight="600" fill="#2F2A24">player locked</text>
    <text x="544" y="316" font-size="12.5" fill="#5B5348">Δy = 0</text>

    <!-- deleted platform below B -->
    <rect x="500" y="556" width="54" height="14" rx="7" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M520 558 l14 10 M534 558 l-14 10" stroke="#C0392B" stroke-width="1.8"/>
    <!-- new platform above B -->
    <rect x="540" y="84" width="54" height="14" rx="7" fill="#E4F3D9" stroke="#4C8A2A" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M567 104 v12" stroke="#4C8A2A" stroke-width="1.8" stroke-dasharray="2 3"/>

    <!-- labels to the right of B -->
    <g font-size="13">
      <line x1="600" y1="91" x2="652" y2="91" stroke="#4C8A2A" stroke-width="1.2"/>
      <text x="658" y="88" font-weight="600" fill="#3E7322">spawn a new platform</text>
      <text x="658" y="105" fill="#5B5348">60–210 px above the topmost,</text>
      <text x="658" y="121" fill="#5B5348">x ∈ [0, 420] so it always fits</text>

      <text x="658" y="400" font-weight="600" fill="#2F2A24">world scrolls down</text>
      <text x="658" y="417" fill="#5B5348">platforms, items, monsters:</text>
      <text x="658" y="433" fill="#5B5348">5 px / tick (10–80 with boosts)</text>

      <line x1="560" y1="563" x2="652" y2="563" stroke="#C0392B" stroke-width="1.2"/>
      <text x="658" y="560" font-weight="600" fill="#A93226">y &gt; 960 → delete</text>
      <text x="658" y="577" fill="#5B5348">keeps the scene small</text>
    </g>

    <!-- camera line across both screens -->
    <line x1="50" y1="326" x2="643" y2="326" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="346" y="314" font-size="12.5" font-weight="700" fill="#A93226" text-anchor="middle">camera line</text>
    <text x="346" y="344" font-size="12.5" fill="#A93226" text-anchor="middle">y = 480</text>

    <!-- captions -->
    <text x="50" y="606" font-size="15" font-weight="700" fill="#26231F">① Below the line</text>
    <text x="50" y="627" font-size="13" fill="#5B5348">the player rises on its own</text>
    <text x="400" y="606" font-size="15" font-weight="700" fill="#26231F">② Above the line</text>
    <text x="400" y="627" font-size="13" fill="#5B5348">the rest of the jump is spent scrolling the world</text>

    <!-- ============ Jump table ============ -->
    <rect x="850" y="150" width="222" height="392" rx="10" fill="#FFFFFF" stroke="#D9CBB2" stroke-width="1.5"/>
    <text x="868" y="182" font-size="15" font-weight="700" fill="#26231F">Distance = ticks × speed</text>
    <text x="868" y="202" font-size="12.5" fill="#8A7A63">1 tick = 8 ms (QTimer)</text>
    <line x1="868" y1="216" x2="1054" y2="216" stroke="#EADFC8"/>

    <g font-size="13.5">
      <text x="868" y="244" font-weight="600" fill="#26231F">Normal jump</text>
      <text x="868" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B5348">64 × 5 px  =   320 px</text>

      <text x="868" y="300" font-weight="600" fill="#26231F">Spring</text>
      <text x="868" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B5348">96 × 10 px =   960 px</text>

      <text x="868" y="356" font-weight="600" fill="#26231F">Trampoline</text>
      <text x="868" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B5348">96 × 20 px = 1,920 px</text>

      <text x="868" y="412" font-weight="600" fill="#26231F">Propeller hat</text>
      <text x="868" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B5348">96 × 40 px = 3,840 px</text>

      <text x="868" y="468" font-weight="600" fill="#26231F">Jetpack</text>
      <text x="868" y="488" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B5348">96 × 80 px = 7,680 px</text>
    </g>
    <text x="868" y="522" font-size="12" fill="#8A7A63">values from player.cpp</text>
  </g>
</svg>
